<title>SuperNova-Pato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed pixel-art canvas; paper "acta" overlays; story dialog and a live race strip pinned to the bottom */
:root {
  --ink: #0c1530;
  --navy: #142347;
  --brick: #b04a2f;
  --brick-dark: #7a2e1c;
  --duck: #f5c938;
  --nut: #7a4a26;
  --paper: #f6eedb;
  --paper-ink: #2a2233;
  --paper-line: #d9cdb2;
  --pink: #ea4f8b;
  --veil: rgba(12, 21, 48, 0.74);
  --race-h: 58px;
  --display: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#c, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#c { image-rendering: pixelated; }
#fx { pointer-events: none; z-index: 30; }
img.px { image-rendering: pixelated; }

#screen {
  position: absolute; inset: 0 0 var(--race-h) 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--veil); overflow-y: auto; touch-action: pan-y;
}
#screen > * { margin: auto 0; }

.btn {
  font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em;
  background: var(--duck); color: var(--ink); border: 3px solid var(--ink); border-radius: 0;
  padding: 0.65em 1.3em; cursor: pointer; box-shadow: 0 5px 0 var(--nut);
  transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--nut); }
.btn:focus-visible, .icon-btn:focus-visible, .pick:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; box-shadow: none; }
.btn.small { font-size: 0.9rem; padding: 0.45em 0.9em; }
.btn:disabled { opacity: 0.5; cursor: default; }

.title { width: 100%; max-width: 560px; display: grid; gap: 18px; }
.logo { font-family: var(--display); line-height: 0.86; margin: 0; }
.logo .a { display: block; font-size: clamp(1.4rem, 6vw, 2.3rem); color: var(--paper); letter-spacing: 0.18em; }
.logo .b { display: block; font-size: clamp(4.2rem, 21vw, 8.2rem); color: var(--duck); font-weight: 700; text-shadow: 5px 5px 0 var(--brick), 10px 10px 0 var(--brick-dark); }
.byline { font-family: var(--display); font-size: 1.05rem; color: var(--duck); margin: 0; }
.story { font-size: 1rem; line-height: 1.55; margin: 0; max-width: 60ch; }
.hero { width: 100%; max-width: 420px; image-rendering: pixelated; display: block; }
.controls { font-size: 0.85rem; opacity: 0.85; margin: 0; line-height: 1.5; }
.controls b { font-family: var(--display); font-weight: 600; color: var(--duck); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.note { font-size: 0.8rem; opacity: 0.75; margin: 0; }

.card {
  width: 100%; max-width: 440px; background: var(--paper); color: var(--paper-ink);
  padding: 22px; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--brick);
  display: grid; gap: 12px; position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--paper-line) 27px 28px);
}
.eyebrow { font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brick); margin: 0; }
.card h2 { font-family: var(--display); font-size: clamp(1.8rem, 7vw, 2.4rem); margin: 0; line-height: 1; text-wrap: balance; color: var(--navy); }
.card p { margin: 0; line-height: 1.55; }
.goal { font-family: var(--display); font-size: 1.05rem; background: var(--navy); color: var(--duck); padding: 6px 10px; justify-self: start; }
.acta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.95rem; margin: 0; }
.acta dt { color: var(--brick-dark); font-weight: 600; }
.acta dd { margin: 0; font-variant-numeric: tabular-nums; }
.grade { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 2px dashed var(--paper-line); padding-top: 12px; }
.grade .num { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--navy); }
.grade .word { font-family: var(--display); font-size: 1.1rem; color: var(--navy); }
.stamp { position: absolute; right: 16px; top: 18px; font-family: var(--display); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em; color: var(--brick); border: 3px solid var(--brick); padding: 4px 8px; transform: rotate(8deg); opacity: 0.85; text-transform: uppercase; }
.sign { font-family: var(--display); font-size: 0.95rem; color: var(--navy); }
.card .btn { justify-self: start; }

/* Character select */
.select { width: 100%; max-width: 760px; display: grid; gap: 14px; }
.select h2 { font-family: var(--display); font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; color: var(--duck); text-shadow: 3px 3px 0 var(--brick); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick {
  display: grid; grid-template-columns: 52px 1fr; gap: 4px 10px; align-items: center; text-align: left;
  background: var(--navy); color: var(--paper); border: 2px solid rgba(246, 238, 219, 0.25);
  padding: 8px; cursor: pointer; font: inherit; min-width: 0; position: relative;
}
.pick img { width: 52px; height: 52px; grid-row: span 2; border: 2px solid var(--ink); background: var(--ink); }
.pick .nm { font-family: var(--display); font-weight: 700; font-size: 1rem; line-height: 1.05; min-width: 0; }
.pick .rl { font-size: 0.72rem; opacity: 0.75; line-height: 1.25; min-width: 0; }
.pick[aria-pressed="true"] { border-color: var(--duck); background: #1d3060; box-shadow: 0 0 0 2px var(--duck); }
.pick .live { position: absolute; top: -8px; right: -6px; font-family: var(--display); font-size: 0.65rem; background: var(--pink); color: #fff; padding: 1px 5px; }
.detail { background: var(--paper); color: var(--paper-ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--brick); padding: 14px 16px; display: grid; gap: 6px; }
.detail h3 { font-family: var(--display); margin: 0; font-size: 1.4rem; color: var(--navy); }
.detail p { margin: 0; line-height: 1.45; font-size: 0.95rem; }
.detail b { color: var(--brick-dark); }

/* Final */
.final { width: 100%; max-width: 540px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.final h2 { font-family: var(--display); font-size: clamp(2.2rem, 10vw, 3.8rem); margin: 0; line-height: 0.95; color: var(--duck); text-shadow: 4px 4px 0 var(--brick); text-wrap: balance; }
.final p { margin: 0; line-height: 1.6; max-width: 46ch; }
#cake { width: 288px; max-width: 80%; image-rendering: pixelated; }
.from { font-family: var(--display); color: var(--duck); font-size: 1.1rem; }
.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; max-width: 360px; text-align: left; }
.podium li { display: grid; grid-template-columns: 2.2em 32px 1fr auto; gap: 8px; align-items: center; background: var(--navy); padding: 4px 8px; font-variant-numeric: tabular-nums; }
.podium li.me { outline: 2px solid var(--duck); }
.podium img { width: 32px; height: 32px; }
.podium .p { font-family: var(--display); color: var(--duck); }

/* Story dialog */
#dialog {
  position: absolute; z-index: 18; left: 0; right: 0; bottom: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.dlg {
  pointer-events: auto; width: 100%; max-width: 640px; background: var(--paper); color: var(--paper-ink);
  border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--brick);
  display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px; cursor: pointer; min-height: 96px;
}
.dlg img { width: 72px; height: 72px; border: 2px solid var(--ink); background: var(--navy); }
.dlg .who { font-family: var(--display); font-weight: 700; color: var(--brick); font-size: 0.95rem; margin: 0 0 4px; }
.dlg .txt { margin: 0; line-height: 1.45; font-size: 1rem; min-width: 0; }
.dlg.narr { grid-template-columns: 1fr; }
.dlg.narr .txt { font-style: italic; }
.dlg .hint { font-family: var(--display); font-size: 0.75rem; color: var(--nut); margin-top: 6px; }
#skipBtn { position: absolute; z-index: 19; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); }

/* In-game buttons */
#topBtns { position: absolute; z-index: 15; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.icon-btn { font-family: var(--display); font-size: 1rem; font-weight: 700; width: 40px; height: 40px; display: grid; place-items: center; background: var(--navy); color: var(--paper); border: 2px solid var(--paper); cursor: pointer; padding: 0; }
.icon-btn[aria-pressed="true"] { color: var(--brick); border-color: var(--brick); text-decoration: line-through; }

/* Touch controls */
#touch { position: absolute; inset: 0 0 var(--race-h) 0; z-index: 10; pointer-events: none; }
#stickZone { position: absolute; left: 0; top: 0; bottom: 0; width: 55%; pointer-events: auto; touch-action: none; }
#stick { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 3px solid rgba(246, 238, 219, 0.5); background: rgba(12, 21, 48, 0.25); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(245, 201, 56, 0.85); border: 3px solid var(--ink); }
#fireBtn, #superBtn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 4px solid var(--ink); font-family: var(--display); font-weight: 700; box-shadow: 0 5px 0 var(--ink); color: var(--paper); }
#fireBtn { right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: 18px; width: 92px; height: 92px; background: var(--nut); font-size: 1rem; }
#superBtn { right: max(124px, calc(env(safe-area-inset-right, 0px) + 116px)); bottom: 26px; width: 70px; height: 70px; background: #3a3f5a; font-size: 0.8rem; }
#superBtn.ready { background: var(--pink); animation: pulse 0.8s infinite alternate; }
#fireBtn.on { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); background: var(--brick); }
@keyframes pulse { to { transform: scale(1.08); } }

/* Race strip */
#race {
  position: absolute; z-index: 16; left: 0; right: 0; bottom: 0; height: var(--race-h);
  background: var(--ink); border-top: 3px solid var(--brick);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center;
}
.race-label { font-family: var(--display); font-size: 0.75rem; line-height: 1.1; color: var(--duck); text-transform: uppercase; letter-spacing: 0.08em; }
.race-label small { display: block; color: var(--paper); opacity: 0.6; text-transform: none; letter-spacing: 0; font-size: 0.7rem; }
.track { position: relative; height: 100%; margin: 0 18px 0 18px; min-width: 0; }
.track .line { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: repeating-linear-gradient(90deg, var(--paper) 0 6px, transparent 6px 10px); opacity: 0.35; }
.track .seg { position: absolute; bottom: 2px; font-family: var(--display); font-size: 0.6rem; color: var(--paper); opacity: 0.55; transform: translateX(-50%); white-space: nowrap; }
.track .tick { position: absolute; top: 30%; bottom: 30%; width: 2px; background: var(--paper); opacity: 0.4; }
.track .flag { position: absolute; right: -14px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: conic-gradient(var(--paper) 25%, var(--ink) 0 50%, var(--paper) 0 75%, var(--ink) 0); background-size: 7px 7px; border: 1px solid var(--paper); }
.racer { position: absolute; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; transition: left 0.6s ease; }
.racer img { width: 34px; height: 34px; border: 2px solid var(--paper); background: var(--navy); display: block; }
.racer.me img { border-color: var(--duck); box-shadow: 0 0 0 2px var(--duck); }
.racer .pos { position: absolute; top: -6px; left: -8px; font-family: var(--display); font-size: 0.65rem; background: var(--duck); color: var(--ink); padding: 0 3px; line-height: 1.3; }
.racer.done .pos { background: var(--pink); color: #fff; }

@media (prefers-reduced-motion: reduce) { .btn, .btn:active, .racer { transition: none; } #superBtn.ready { animation: none; } }
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="touch" hidden>
    <div id="stickZone"></div>
    <div id="stick" hidden><div id="knob"></div></div>
    <button id="superBtn" type="button" aria-label="Superpoder">SÚPER</button>
    <button id="fireBtn" type="button" aria-label="Atacar">ATACA</button>
  </div>
  <div id="topBtns" hidden>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Silenciar" aria-pressed="false">♪</button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pausa">II</button>
  </div>
  <div id="dialog" hidden></div>
  <button class="btn small ghost" id="skipBtn" type="button" hidden>Saltar historia</button>
  <div id="screen"></div>
  <div id="race">
    <div class="race-label">Carrera<small id="raceNote">tú solo</small></div>

      <div class="line"></div>

      <div id="racers"></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
"use strict";

// ---------- DOM & canvases ----------
const $ = id => document.getElementById(id);
const app = $('app');
const c = $('c'), ctx = c.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
const low = document.createElement('canvas'), lx = low.getContext('2d');
const screenEl = $('screen'), touchEl = $('touch'), dialogEl = $('dialog'), skipBtn = $('skipBtn');
const stickZone = $('stickZone'), stick = $('stick'), knob = $('knob'), fireBtn = $('fireBtn'), superBtn = $('superBtn');
const topBtns = $('topBtns'), muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn');
const raceEl = $('race'), racersEl = $('racers'), raceNote = $('raceNote');

let cssW = 0, cssH = 0, dpr = 1, VW = 320, VH = 180, KX = 1, KY = 1, raceWorld = 10;
function resize() {
  const r = app.getBoundingClientRect();
  cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  let k = Math.min(cssW, cssH) / 180;
  if (k > 2.5) k = Math.round(k);
  if (k < 1) k = 1;
  VW = Math.ceil(cssW / k); VH = Math.ceil(cssH / k);
  low.width = VW; low.height = VH;
  c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
  fx.width = c.width; fx.height = c.height;
  KX = c.width / VW; KY = c.height / VH;
  raceWorld = 58 / cssH * VH;
}
window.addEventListener('resize', resize);
resize();

const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
function hsh(a, b) {
  let h = (a * 374761393 + b * 668265263) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; } }

// ---------- Sprites ----------
function makeSprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { g.fillStyle = col; g.fillRect(i, j, 1, 1); } } });
  return cv;
}
function flip(src) {
  const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const g = cv.getContext('2d'); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return cv;
}

const HUMAN_FRONT = [
  "................",

  "....khsssshk....",
  "....kggssggk....",

  "..ksbbbbtbbbbsk.",
  "...kbbbbbbbbk...",
  "....kppppppk....",
  "....kpk..kpk....",
  "....kkk..kkk....",
];
const HUMAN_BACK = [
  "................",
  ".....kkkkkk.....",
  "....khhhhhhk....",
  "....khhhhhhk....",
  "....khhhhhhk....",
  "....khhhhhhk....",
  "....kshhhhsk....",
  ".....kssssk.....",
  "...kbbbbbbbbk...",

  "..ksbbbbbbbbsk..",
  "...kbbbbbbbbk...",
  "....kppppppk....",
  "....kpk..kpk....",
  "....kkk..kkk....",
];
const HUMAN_SIDE = [
  "................",
  "......kkkkk.....",
  ".....khhhhhk....",
  ".....khhhssk....",
  ".....khhsggg....",
  ".....khssssk....",
  ".....ksssmsk....",
  "......kssk......",
  ".....kbbbwk.....",
  "....kbbbbwtk....",
  "....kbbbbbbk....",
  "....kbbsbbbk....",
  "....kbbbbbbk....",
  ".....kppppk.....",
  ".....kpkkpk.....",
  ".....kk..kk.....",
];
function humanSprites(L) {
  const pal = { k: '#1d1622', h: L.hair, s: L.skin || '#f1c49c', g: L.glasses || '#2a1d1a', m: '#9a3f33', b: L.jacket, w: L.shirt, t: L.tie || L.shirt, p: L.pants || '#33343f', r: '#d0463a' };
  let F = HUMAN_FRONT.slice(), B = HUMAN_BACK.slice(), S = HUMAN_SIDE.slice();
  if (L.priest) {
    const fix = r => r.replace(/[wt]/g, 'b');
    F = F.map((r, i) => i >= 9 && i <= 11 ? fix(r) : r);
    S = S.map((r, i) => i >= 9 && i <= 11 ? fix(r) : r);
    pal.w = '#ffffff';
  }
  if (L.bald) {
    F[2] = "....kssssssk....";
    B[2] = "....kssssssk...."; B[3] = "....khsssshk....";
    S[2] = ".....khssssk...."; S[3] = ".....khssssk....";
  }
  if (L.scar) F[3] = "....khsrsshk....";
  const right = makeSprite(S, pal);
  return { front: makeSprite(F, pal), back: makeSprite(B, pal), right, left: flip(right) };
}

  g.fillStyle = bgc; g.fillRect(0, 0, 14, 14);
  g.drawImage(spr, 1, 0, 14, 14, 0, 1, 14, 14);
  return cv.toDataURL();
}

// ---------- Gameplay ----------
function nearestEnemy(x, y, range) {
  let best = null, bd = range;
  for (const e of enemies) {
    if (e.grown) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < bd) { bd = d; best = e; }
  }

}
const FACE_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const superActive = id => player && player.superT > 0 && me.id === id;

function spawnProj(ang, opts = {}) {

  projs.push({
    x: player.x, y: player.y - 8, vx: Math.cos(ang) * W.speed, vy: Math.sin(ang) * W.speed,
    life: W.life, kind: me.weapon, dmg: W.dmg, pierce: superActive('alberto') ? 99 : (W.pierce || 0),
    home: !!W.home, splash: W.splash || 0, text: W.words ? pick(W.words) : null, hit: new Set(), bounce: 0, ...opts,
  });
  const n = projs[projs.length - 1];
  if (player.ball > 0 && !opts.text) Object.assign(n, { kind: 'ball', text: null, home: false, splash: 0, bounce: 2, life: W.life + 0.5 });
}
function attack(ax, ay) {
  const W = WEAPONS[me.weapon];
  const base = Math.atan2(ay, ax);
  const spread = player.power > 0 ? [-0.22, 0, 0.22] : [0];
  for (const s of spread) spawnProj(base + s);
  let cd = W.cd;
  if (superActive('alberto') || superActive('nefro')) cd *= 0.4;
  if (player.power > 0) cd *= 0.6;
  player.cd = cd;
  lv.nuts++; G.nuts++;
  if (Math.abs(ax) > Math.abs(ay)) player.face = ax < 0 ? 'left' : 'right'; else player.face = ay < 0 ? 'up' : 'down';
  sfx.throw();
}

function burst(x, y, cols, n = 8, sp = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(sp * 0.3, sp);

}

  sfx.hit(); sfx.quack();

function convert(e) {

  if (e.type === 'X') {

    else if (r > 0.97) pickups.push({ type: pick(['B', 'M']), x: e.x, y: e.y, t: 0 });

function update(dt) {
  T += dt; lv.time += dt; G.time += dt;
  let mx = input.jx, my = input.jy;
  if (keys.left) mx -= 1; if (keys.right) mx += 1; if (keys.up) my -= 1; if (keys.down) my += 1;

  const car = superActive('ferrari');

    const sp = car ? 165 : 74;
    moveEntity(player, mx * sp * dt, 0); moveEntity(player, 0, my * sp * dt);
    player.walk += dt;

    }
    if (me.id === 'ferrari') {
      for (const e of enemies) {
        if (e.grown) continue;
        e.ram = Math.max(0, e.ram - dt);
        if (e.ram <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < (e.type === 'X' ? 22 : 14)) { e.ram = 0.4; damage(e, e.type === 'X' ? 1 : 2, Math.sign(e.x - player.x), Math.sign(e.y - player.y)); }
      }

  }

    if (input.mouseDown) {

      attack(wx - player.x, wy - (player.y - 8));
    } else if (keys.fire || input.fire) {
      const t = nearestEnemy(player.x, player.y, 170);
      if (t) attack(t.x - player.x, (t.y - (t.type === 'X' ? 16 : 7)) - (player.y - 8));

    }
  }

    if (n.home) {
      const t = nearestEnemy(n.x, n.y, 110);
      if (t) {
        const sp = Math.hypot(n.vx, n.vy), dx = t.x - n.x, dy = (t.y - 8) - n.y, d = Math.hypot(dx, dy) || 1;
        n.vx += (dx / d * sp - n.vx) * Math.min(1, dt * 6); n.vy += (dy / d * sp - n.vy) * Math.min(1, dt * 6);
      }
    }

    n.x += n.vx * dt; n.y += n.vy * dt; n.life -= dt;

      n.x = ox; n.y = oy; n.bounce--; n.hit.clear(); sfx.hit();
      continue;
    }
    if (n.kind === 'spell' && Math.random() < 0.6) parts.push({ x: n.x, y: n.y, vx: 0, vy: 0, life: 0.25, col: pick(['#bfefff', '#ffffff', '#f5c938']), g: 0 });
    if (solidAt(n.x, n.y + 4)) { n.life = 0; if (n.splash) splash(n); else burst(n.x, n.y, ['#9b6534', '#cfd6dc'], 4, 40); continue; }
    for (const e of enemies) {

        n.hit.add(e);
        damage(e, n.dmg, n.vx / d, n.vy / d);
        if (n.splash) { splash(n); n.life = 0; break; }

  for (const a of allies) {

      if (a.x < 16 || a.x > MW * 16 - 16) a.vx *= -1;
      if (a.y < 24 || a.y > MH * 16 - 8) a.vy *= -1;
      if (Math.random() < 0.8) parts.push({ x: a.x + rand(-10, 10), y: a.y - rand(0, 24), vx: 0, vy: -10, life: 0.4, col: '#bff3ff', g: 0 });
      for (const e of enemies) if (!e.grown && !a.hit.has(e) && Math.hypot(e.x - a.x, e.y - a.y) < (e.type === 'X' ? 30 : 20)) { a.hit.add(e); damage(e, e.type === 'X' ? 5 : 4); }

      const t = nearestEnemy(a.x, a.y, 220);

  allies = allies.filter(a => a.life > 0);

  let active = 0;
  for (const e of enemies) {
    e.t += dt; e.hit = Math.max(0, e.hit - dt);
    if (e.bubble) { e.bubble.t -= dt; if (e.bubble.t <= 0) e.bubble = null; }
    if (e.pending !== undefined) {
      e.pending -= dt;
      if (e.pending <= 0) { delete e.pending; convert(e); }
      else { active++; continue; }
    }
    if (e.grown) {
      wander(e, dt, 12);
      if (e.type !== 'X') { if (moveEntity(e, e.vx * dt, e.vy * dt)) e.wt = 0; }
      if (e.vx) e.dir = e.vx < 0 ? -1 : 1;
      continue;
    }
    active++;
    if (e.frozen > 0) {
      e.frozen -= dt;
      if (e.exam > 0) { e.exam -= dt; e.examTick -= dt; if (e.examTick <= 0) { e.examTick = e.dance ? 2 : 1.2; damage(e, 1); } }
      if (e.frozen <= 0) e.dance = false;
      if (e.dance) e.dir = Math.floor(e.t * 4) % 2 ? 1 : -1;
      continue;
    }
    if (e.type === 'X') { updateBoss(e, dt); continue; }
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (e.type === 'D') {
      if (d < 100) { e.vx = dx / d * 30; e.vy = dy / d * 30; } else wander(e, dt, 18);
    } else if (e.type === 'R') {
      e.cool -= dt;
      if (e.dash > 0) { e.dash -= dt; if (e.dash <= 0) { e.vx = e.vy = 0; } }
      else if (e.cool <= 0 && d < 135) { e.dash = 0.45; e.cool = rand(2, 3); e.vx = dx / d * 135; e.vy = dy / d * 135; sfx.quack(); e.bubble = { text: '¡POV: sprint!', t: 0.8 }; }
      else wander(e, dt, 12);
    } else if (e.type === 'F') {
      if (d < 160) {
        if (d > 95) { e.vx = dx / d * 24; e.vy = dy / d * 24; }
        else if (d < 55) { e.vx = -dx / d * 26; e.vy = -dy / d * 26; }
        else { e.vx = -dy / d * 16; e.vy = dx / d * 16; }
        e.cool -= dt;
        if (e.cool <= 0) { e.cool = rand(1.8, 2.6); enemyShoot(e, Math.atan2(dy - 2, dx)); sfx.shoot(); }
      } else wander(e, dt, 14);
    }
    if (moveEntity(e, e.vx * dt, 0) | moveEntity(e, 0, e.vy * dt)) { if (e.dash <= 0) e.wt = 0; }
    if (Math.abs(e.vx) > 2) e.dir = e.vx < 0 ? -1 : 1;
    if (d < 11) hurt(1, e.x, e.y);
    e.bt -= dt;
    if (e.bt <= 0) { e.bt = rand(4, 9); if (!e.bubble && onScreen(e)) e.bubble = { text: pick(GENZ), t: 1.6 }; }
  }

  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (solidAt(s.x, s.y + 4)) { s.life = 0; continue; }
    if (Math.hypot(s.x - player.x, s.y - (player.y - 7)) < 8 && player.inv <= 0) { s.life = 0; hurt(1, s.x, s.y); }
  }
  shots = shots.filter(s => s.life > 0);

  for (const p of pickups) {
    p.t += dt;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 12) {
      p.taken = true; sfx.pickup();
      if (p.type === 'Q') { player.hp = Math.min(player.max, player.hp + 2); float(p.x, p.y - 16, '+2 queso de Burgos', '#fbf8ef'); }
      else if (p.type === 'B') { player.ball = 10; float(p.x, p.y - 16, '¡Puxa Sporting! Balones que rebotan', '#ffffff'); }
      else if (p.type === 'M') {
        retro = 10; float(p.x, p.y - 16, '¡Música de los 80!', '#ea4f8b');
        for (const e of enemies) if (!e.grown && onScreen(e)) { e.frozen = e.type === 'X' ? 3 : 6; e.exam = e.frozen; e.examTick = 1; e.dance = true; e.bubble = { text: pick(DANCE_LINES), t: 2 }; }
      }
      else { player.power = 10; float(p.x, p.y - 16, '¡Cascanueces! Triple ataque', '#f5c938'); }
      burst(p.x, p.y - 6, ['#fbf8ef', '#f5c938'], 10, 50);
    }
  }
  pickups = pickups.filter(p => !p.taken);

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 14 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  for (const fe of effects) fe.t += dt;
  effects = effects.filter(fe => fe.t < fe.dur);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  updateSuperBtn();

  if (state === 'play' && active === 0 && lv.end < 0) { lv.end = levelIdx === 2 ? 3.2 : 1.6; sfx.clear(); }
  if (lv.end >= 0 && state === 'play') {
    lv.end -= dt;
    if (lv.end <= 0) { lv.end = -2; if (levelIdx === LEVELS.length - 1) showFinal(); else showClear(); }
  }
  updateCamera(false);
}

function splash(n) {
  burst(n.x, n.y, ['#7be06a', '#d8f0f5', '#3fbf5a'], 12, 60);
  for (const e of enemies) if (!e.grown && !n.hit.has(e) && Math.hypot(e.x - n.x, (e.y - 7) - n.y) < n.splash) { n.hit.add(e); damage(e, 1); }
}

function updateBoss(e, dt) {
  const phase2 = e.hp < e.max / 2;
  const tx = e.cx + Math.sin(e.t * 0.55) * 90, ty = e.cy + Math.sin(e.t * 1.2) * 22;
  e.x += (tx - e.x) * Math.min(1, dt * 1.5); e.y += (ty - e.y) * Math.min(1, dt * 1.5);
  e.x = clamp(e.x, 40, MW * 16 - 40); e.y = clamp(e.y, 70, MH * 16 - 40);
  e.dir = player.x < e.x ? -1 : 1;
  const base = Math.atan2((player.y - 7) - (e.y - 20), player.x - e.x);
  e.cool -= dt;
  if (e.cool <= 0) {
    const n = phase2 ? 7 : 5, spread = 0.9;
    for (let i = 0; i < n; i++) enemyShoot(e, base - spread / 2 + spread * i / (n - 1), phase2 ? 80 : 66);
    e.cool = phase2 ? 1.4 : 2; sfx.shoot();
  }
  if (phase2) { e.ring -= dt; if (e.ring <= 0) { e.ring = 4.5; for (let i = 0; i < 10; i++) enemyShoot(e, i / 10 * Math.PI * 2 + e.t, 55); } }
  e.sum -= dt;
  if (e.sum <= 0) {
    e.sum = phase2 ? 6 : 8;
    const alive = enemies.filter(o => !o.grown).length;
    if (alive < 7) for (let i = 0; i < 2; i++) {
      const sx = e.x + (i ? 30 : -30), sy = e.y + 16;
      if (!boxHits(sx, sy)) { const m = makeEnemy(Math.random() < 0.6 ? 'D' : 'R', sx, sy); m.bubble = { text: '¡Hola, seguidores!', t: 1.4 }; enemies.push(m); lv.total++; burst(sx, sy - 8, ['#ffffff', '#ea4f8b'], 10, 50); }
    }
    e.bubble = { text: pick(BOSS_LINES), t: 1.6 };
    sfx.quack();
  }
  if (Math.hypot(player.x - e.x, player.y - e.y) < 18) hurt(1, e.x, e.y);
}

function onScreen(e) { return e.x > camX - 8 && e.x < camX + VW + 8 && e.y > camY && e.y < camY + VH + 16; }
function updateCamera(snap) {
  if (!player) return;
  const viewH = VH - raceWorld;
  let tx = player.x - VW / 2, ty = player.y - 8 - viewH / 2;
  const mw = MW * 16, mh = MH * 16;
  tx = mw <= VW ? (mw - VW) / 2 : clamp(tx, 0, mw - VW);
  ty = mh <= viewH ? (mh - viewH) / 2 : clamp(ty, 0, mh - viewH);
  if (snap) { camX = tx; camY = ty; } else { camX += (tx - camX) * 0.18; camY += (ty - camY) * 0.18; }
}

// ---------- Rendering ----------
function drawSprite(g, spr, x, y, scale = 1) {
  const w = spr.width * scale, h = spr.height * scale;
  g.drawImage(spr, Math.round(x - w / 2), Math.round(y - h), w, h);
}
function shadow(g, x, y, w) {
  g.fillStyle = 'rgba(20,16,30,0.28)';
  g.beginPath(); g.ellipse(Math.round(x), Math.round(y), w, w * 0.35, 0, 0, Math.PI * 2); g.fill();
}
function drawCar(g, x, y, face) {
  g.save(); g.translate(Math.round(x), Math.round(y - 6));
  if (face === 'up' || face === 'down') g.rotate(Math.PI / 2);
  if (face === 'left' || face === 'up') g.scale(-1, 1);
  rect(g, 'rgba(20,16,30,0.3)', -12, 3, 24, 4);
  rect(g, '#111', -9, -6, 5, 2); rect(g, '#111', 4, -6, 5, 2); rect(g, '#111', -9, 4, 5, 2); rect(g, '#111', 4, 4, 5, 2);
  rect(g, '#d3202a', -12, -5, 24, 10); rect(g, '#f04048', -12, -5, 24, 2);
  rect(g, '#2b2b33', -3, -4, 7, 8); rect(g, '#7fb6d8', 4, -4, 2, 8);
  rect(g, '#f5c938', 9, -1, 2, 2);
  rect(g, me.look.hair, -2, -2, 4, 4);
  g.restore();
}

function render() {
  lx.imageSmoothingEnabled = false;
  lx.fillStyle = '#0c1530'; lx.fillRect(0, 0, VW, VH);
  if (state === 'story') { renderStory(); return; }
  if (!bg) return;
  const sx = shake > 0 ? rand(-2, 2) : 0, sy = shake > 0 ? rand(-2, 2) : 0;
  const cx = Math.round(camX + sx), cy = Math.round(camY + sy);
  lx.drawImage(bg, -cx, -cy);
  lx.save(); lx.translate(-cx, -cy);

  for (const p of pickups) {
    const bob = Math.round(Math.sin(p.t * 4) * 1.5);
    shadow(lx, p.x, p.y, 5);
    drawSprite(lx, { Q: SPR.cheese, N: SPR.cracker, B: SPR.ball, M: SPR.tape }[p.type], p.x, p.y - 2 + bob);
  }
  if (superActive('juancho')) {
    lx.strokeStyle = 'rgba(245,201,56,0.7)'; lx.lineWidth = 1; lx.setLineDash([3, 3]); lx.lineDashOffset = -T * 20;
    lx.beginPath(); lx.ellipse(Math.round(player.x), Math.round(player.y - 4), 80, 56, 0, 0, Math.PI * 2); lx.stroke(); lx.setLineDash([]);
  }

  const actors = enemies.map(e => ({ y: e.y, e })).concat([{ y: player.y, p: true }], allies.map(a => ({ y: a.y, a })));
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a.p) {
      if (superActive('ferrari')) { drawCar(lx, player.x, player.y, player.face); continue; }
      shadow(lx, player.x, player.y, 6);
      if (player.inv > 0 && Math.floor(player.inv * 14) % 2) continue;
      const S = me.spr, spr = player.face === 'up' ? S.back : player.face === 'down' ? S.front : S[player.face];
      const bob = player.moving && Math.floor(player.walk * 9) % 2 ? 1 : 0;
      if (player.superT > 0) { lx.fillStyle = `rgba(234,79,139,${0.25 + 0.15 * Math.sin(T * 12)})`; lx.beginPath(); lx.arc(Math.round(player.x), Math.round(player.y - 8), 11, 0, Math.PI * 2); lx.fill(); }
      drawSprite(lx, spr, player.x, player.y - bob);
      if (player.power > 0) { lx.fillStyle = '#f5c938'; lx.fillRect(Math.round(player.x - 1), Math.round(player.y - 20 - bob), 2, 2); }
      continue;
    }
    if (a.a) {
      const al = a.a;
      if (al.kind === 'patronus') { lx.globalAlpha = 0.75 + 0.2 * Math.sin(T * 20); drawSprite(lx, al.vx < 0 ? SPR.patronusL : SPR.patronus, al.x, al.y, 2); lx.globalAlpha = 1; }
      else drawSprite(lx, al.dir < 0 ? SPR.mouseL : SPR.mouse, al.x, al.y);
      continue;
    }
    const e = a.e;
    if (e.type === 'X') {
      shadow(lx, e.x, e.y, 14);
      if (!e.grown) { lx.strokeStyle = '#fff4c2'; lx.lineWidth = 2; lx.beginPath(); lx.arc(Math.round(e.x), Math.round(e.y - 22), 17, 0, Math.PI * 2); lx.stroke(); }
      if (e.hit > 0 && Math.floor(e.hit * 30) % 2) continue;
      drawSprite(lx, e.grown ? (e.dir < 0 ? SPR.grownL : SPR.grown) : (e.dir < 0 ? SPR.bossL : SPR.boss), e.x, e.y, 2);
      if (e.exam > 0 && !e.grown) { if (e.dance) drawNote(lx, e.x + 12, e.y - 40); else drawSprite(lx, SPR.exam, e.x + 10, e.y - 34); }
      continue;
    }
    shadow(lx, e.x, e.y, 5);
    if (e.hit > 0 && Math.floor(e.hit * 30) % 2) continue;
    const spr = e.grown ? (e.dir < 0 ? SPR.grownL : SPR.grown) : SPR['duck' + e.type + (e.dir < 0 ? 'L' : '')];
    const waddle = e.frozen <= 0 && (Math.abs(e.vx) + Math.abs(e.vy) > 1) && Math.floor(e.t * 8) % 2 ? 1 : 0;
    drawSprite(lx, spr, e.x, e.y - waddle);
    if (e.exam > 0 && !e.grown) { if (e.dance) drawNote(lx, e.x + 6, e.y - 20 - Math.floor(e.t * 3) % 3); else drawSprite(lx, SPR.exam, e.x + 6, e.y - 14); }
  }

  for (const n of projs) {
    if (n.text) continue;
    const px = Math.round(n.x), py = Math.round(n.y);
    if (n.kind === 'nut') drawSprite(lx, SPR.nut, n.x, n.y + 3);
    else if (n.kind === 'ball') drawSprite(lx, SPR.ball, n.x, n.y + 3);
    else if (n.kind === 'book') drawSprite(lx, SPR.book, n.x, n.y + 3);
    else if (n.kind === 'exam') drawSprite(lx, SPR.exam, n.x, n.y + 3);
    else if (n.kind === 'flask') drawSprite(lx, SPR.flask, n.x, n.y + 3);
    else if (n.kind === 'spell') { rect(lx, '#ffffff', px - 1, py, 3, 1); rect(lx, '#ffffff', px, py - 1, 1, 3); rect(lx, '#bfefff', px - 2, py, 1, 1); }
    else {
      lx.save(); lx.translate(px, py); lx.rotate(Math.atan2(n.vy, n.vx));
      if (n.kind === 'spear') { rect(lx, '#8a5a32', -6, 0, 9, 1); rect(lx, '#d7dce0', 3, -1, 3, 3); }
      else { rect(lx, '#e8f4f8', -4, -1, 6, 2); rect(lx, '#7a8a99', -6, -1, 2, 2); rect(lx, '#cfd6dc', 2, 0, 3, 1); }
      lx.restore();
    }
  }
  for (const p of parts) { lx.fillStyle = p.col; lx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const fe of effects) {
    if (fe.kind === 'nova') {
      const k = fe.t / fe.dur, r = 8 + k * 170;
      lx.fillStyle = `rgba(255,236,170,${0.45 * (1 - k)})`; lx.beginPath(); lx.arc(fe.x, fe.y, r, 0, Math.PI * 2); lx.fill();
      lx.strokeStyle = `rgba(255,255,255,${1 - k})`; lx.lineWidth = 3; lx.beginPath(); lx.arc(fe.x, fe.y, r, 0, Math.PI * 2); lx.stroke();
      lx.strokeStyle = `rgba(234,79,139,${1 - k})`; lx.lineWidth = 2; lx.beginPath(); lx.arc(fe.x, fe.y, r * 0.7, 0, Math.PI * 2); lx.stroke();
    }
  }
  lx.restore();
  if (flash > 0) { lx.fillStyle = `rgba(255,250,230,${Math.min(0.7, flash * 1.6)})`; lx.fillRect(0, 0, VW, VH); }

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, c.width, c.height);

  const toS = (x, y) => [(x - cx) * KX, (y - cy) * KY];
  const fs = clamp(3.4 * KY, 10 * dpr, 15 * dpr);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of shots) { const [x, y] = toS(s.x, s.y); pill(ctx, s.text, x, y, fs, '#ea4f8b', '#ffffff'); }
  for (const n of projs) if (n.text) { const [x, y] = toS(n.x, n.y); pill(ctx, n.text, x, y, fs * 0.9, n.kind === 'advice' ? '#f6eedb' : '#7fd8ff', '#142347'); }
  ctx.font = `500 ${fs * 0.92}px "Work Sans", system-ui, sans-serif`;
  for (const e of enemies) if (e.bubble) { const [x, y] = toS(e.x, e.y - (e.type === 'X' ? 44 : 20)); bubble(ctx, e.bubble.text, x, y, fs * 0.92, e.bubble.grown); }
  if (player.bubble) { const [x, y] = toS(player.x, player.y - 20); bubble(ctx, player.bubble.text, x, y, fs * 0.92, true, true); }
  ctx.font = `700 ${fs}px "Pixelify Sans", monospace`;
  for (const f of floats) {
    const [x, y] = toS(f.x, f.y);
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = '#0c1530'; ctx.fillText(f.text, x + dpr * 1.5, y + dpr * 1.5);
    ctx.fillStyle = f.col; ctx.fillText(f.text, x, y);
    ctx.globalAlpha = 1;
  }
  if (state === 'play' || state === 'dying' || state === 'paused') drawHUD();
}

function pill(g, text, x, y, fs, bgc, fg) {
  g.font = `600 ${fs}px "Pixelify Sans", monospace`;
  const w = g.measureText(text).width + fs * 0.9, h = fs * 1.45;
  g.fillStyle = bgc; roundRect(g, x - w / 2, y - h / 2, w, h, h / 2); g.fill();
  g.lineWidth = Math.max(1, dpr * 1.5); g.strokeStyle = '#0c1530'; g.stroke();
  g.fillStyle = fg; g.fillText(text, x, y + 1);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrapText(g, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function bubble(g, text, x, y, fs, grown, hero) {
  const lines = wrapText(g, text, fs * 11);
  const lh = fs * 1.25, w = Math.max(...lines.map(l => g.measureText(l).width)) + fs * 1.2, h = lines.length * lh + fs * 0.7;
  const bx = clamp(x - w / 2, 4 * dpr, c.width - w - 4 * dpr), by = y - h - fs * 0.6;
  g.fillStyle = hero ? '#f5c938' : grown ? '#f6eedb' : '#ffffff';
  g.strokeStyle = hero ? '#0c1530' : grown ? '#21386e' : '#ea4f8b'; g.lineWidth = Math.max(1.5, dpr * 1.5);
  roundRect(g, bx, by, w, h, fs * 0.4); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x - fs * 0.4, by + h - 1); g.lineTo(x, by + h + fs * 0.55); g.lineTo(x + fs * 0.4, by + h - 1); g.closePath(); g.fill();
  g.fillStyle = grown || hero ? '#142347' : '#2a2233';
  lines.forEach((l, i) => g.fillText(l, bx + w / 2, by + fs * 0.35 + lh * (i + 0.5)));
}

function drawHUD() {
  const u = dpr, x0 = 16 * u, y0 = 14 * u, hs = 3 * u;
  for (let i = 0; i < player.max; i++) ctx.drawImage(i < player.hp ? SPR.heart : SPR.heartE, x0 + i * 9 * hs, y0, 7 * hs, 6 * hs);
  const active = enemies.filter(e => !e.grown && e.type !== 'X').length;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `600 ${14 * u}px "Pixelify Sans", monospace`;
  const label = `Patos por madurar: ${active}`;
  ctx.fillStyle = '#0c1530'; ctx.fillText(label, x0 + 2 * u, y0 + 26 * u);
  ctx.fillStyle = '#f6eedb'; ctx.fillText(label, x0, y0 + 24 * u);
  let yy = y0 + 46 * u;
  const ready = player.charge >= 1 && player.superT <= 0;
  ctx.fillStyle = '#0c1530'; ctx.fillRect(x0, yy, 124 * u, 12 * u);
  const fill = player.superT > 0 ? 1 : player.charge;
  ctx.fillStyle = ready ? (Math.floor(T * 6) % 2 ? '#ea4f8b' : '#f5c938') : player.superT > 0 ? '#ea4f8b' : '#b06a9a';
  ctx.fillRect(x0 + 2 * u, yy + 2 * u, 120 * u * fill, 8 * u);
  ctx.font = `600 ${11 * u}px "Pixelify Sans", monospace`;
  ctx.fillStyle = ready ? '#f5c938' : '#f6eedb';
  const sn = me.sup.name.length > 22 ? me.sup.name.slice(0, 21) + '…' : me.sup.name;
  ctx.fillText(ready ? (isTouch ? `${sn}: pulsa SÚPER` : `${sn}: pulsa E`) : sn, x0 + 130 * u, yy);
  yy += 18 * u;
  for (const [name, val, col] of [['Cascanueces', player.power, '#f5c938'], ['Balón del Sporting', player.ball, '#ffffff'], ['Música de los 80', retro, '#ea4f8b']]) {
    if (val <= 0) continue;
    ctx.fillStyle = '#0c1530'; ctx.fillRect(x0, yy, 104 * u, 10 * u);
    ctx.fillStyle = col; ctx.fillRect(x0 + 2 * u, yy + 2 * u, 100 * u * val / 10, 6 * u);
    ctx.fillText(name, x0 + 110 * u, yy - 1 * u);
    yy += 16 * u;
  }
  const boss = enemies.find(e => e.type === 'X' && !e.grown);
  if (boss) {
    const bw = Math.min(cssW - 32, 340) * u, bx = (c.width - bw) / 2, by = Math.max(yy + 4 * u, 84 * u);
    ctx.textAlign = 'center';
    ctx.font = `700 ${12 * u}px "Pixelify Sans", monospace`;

// ---------- Race (shared progress) ----------
const RACE = { db: null, mq: null, user: null, myId: null, racers: {}, names: {}, last: 0, timer: null, startedAt: 0, finishedAt: null, owner: false };
const RACE_TTL = 8 * 3600 * 1000;
// Outside claude.ai (e.g. GitHub Pages) the race goes through a public MQTT broker: no accounts,
// one retained message per player so late joiners see everyone. The data is public: character + progress only.
const MQTT_LIB = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
// Port 443 first: campus and office networks often block the brokers' other ports.
const MQTT_URLS = ['wss://public.cloud.shiftr.io', 'wss://broker.hivemq.com:8884/mqtt'];
const MQTT_ROOM = 'supernova-pato/jnp-2026/racers';
function initRelay() {
  let pid = store('snp-pid');
  if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); store('snp-pid', pid); }
  RACE.myId = pid; RACE.owner = true;
  const s = document.createElement('script');
  s.src = MQTT_LIB;
  s.onload = () => connectRelay(0);
  s.onerror = () => { raceNote.textContent = 'sin conexión'; };
  document.head.appendChild(s);
  if (state === 'title') showTitle();
}
function connectRelay(i) {
  if (!window.mqtt || i >= MQTT_URLS.length) { raceNote.textContent = 'sin conexión'; return; }
  let ok = false;
  const client = window.mqtt.connect(MQTT_URLS[i], { clientId: 'snp_' + RACE.myId + '_' + Math.random().toString(36).slice(2, 6), connectTimeout: 6000, reconnectPeriod: 3000, clean: true, username: 'public', password: 'public' });
  const fail = setTimeout(() => { if (!ok) { client.end(true); connectRelay(i + 1); } }, 8000);
  client.on('connect', () => {
    ok = true; clearTimeout(fail);
    RACE.mq = client;
    client.subscribe(MQTT_ROOM + '/+');
    renderRace();
    if (RACE.startedAt) raceSync(true);
  });
  client.on('message', (topic, payload) => {
    const id = topic.slice(MQTT_ROOM.length + 1);
    if (!/^p[a-z0-9]{1,12}$/.test(id) || id === RACE.myId) return;
    let v = null;
    try { v = payload && payload.length ? JSON.parse(payload.toString()) : null; } catch (_) {}
    if (v && typeof v === 'object' && CH[v.char] && Date.now() - (+v.updatedAt || 0) < RACE_TTL) {
      RACE.racers[id] = { char: v.char, level: clamp(+v.level || 0, 0, 3), done: Math.max(0, +v.done || 0), total: Math.max(1, +v.total || 1), startedAt: +v.startedAt || 0, finishedAt: +v.finishedAt || null, updatedAt: +v.updatedAt || 0 };
    } else delete RACE.racers[id];
    renderRace();
    if (state === 'select') markLive();
  });
  client.on('offline', () => { raceNote.textContent = 'reconectando'; });
}
async function initRace() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { initRelay(); renderRace(); return; }
  try {
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    RACE.user = user;
    if (user) { try { RACE.myId = await user.id(); RACE.owner = await user.isOwner(); } catch (_) {} }
    if (db && RACE.myId) {
      RACE.db = db;
      db.collection('racers').onSnapshot(snap => {
        const now = Date.now(), next = {};
        for (const d of snap.docs) { const v = d.data(); if (v && now - (v.updatedAt || 0) < RACE_TTL) next[d.id] = v; }
        RACE.racers = next;
        resolveNames(); renderRace();
        if (state === 'select') markLive();
      }, () => { RACE.db = null; renderRace(); });
    }
  } catch (_) {}
  renderRace();
  if (state === 'title' && RACE.owner) showTitle();
}
async function resolveNames() {
  const u = RACE.user; if (!u || !u.profiles) return;
  const ids = Object.keys(RACE.racers).filter(id => !(id in RACE.names));
  if (!ids.length) return;
  for (const id of ids) RACE.names[id] = '';
  try { const ps = await u.profiles(ids); for (const id of ids) RACE.names[id] = (ps[id] && ps[id].name) || ''; renderRace(); } catch (_) {}
}
function myRecord() {
  if (!RACE.startedAt) return null;
  const fin = RACE.finishedAt;
  return { char: me.id, level: fin ? 3 : levelIdx, done: fin ? 0 : (lv ? lv.converted : 0), total: lv ? lv.total : 1, startedAt: RACE.startedAt, finishedAt: fin || null, updatedAt: Date.now() };
}
function raceSync(force) {
  renderRace();
  if (!(RACE.db || RACE.mq) || !RACE.myId || !RACE.startedAt) return;
  const doWrite = () => {
    RACE.timer = null; RACE.last = Date.now();
    const rec = myRecord(); if (!rec) return;
    if (RACE.mq) { RACE.mq.publish(MQTT_ROOM + '/' + RACE.myId, JSON.stringify(rec), { retain: true, qos: 1 }); return; }
    RACE.db.doc('racers/' + RACE.myId).set(rec).then(() => renderRace(), () => { raceNote.textContent = 'sin guardar'; });
  };
  const since = Date.now() - RACE.last;
  if (force || since > 1500) { if (RACE.timer) { clearTimeout(RACE.timer); RACE.timer = null; } doWrite(); }
  else if (!RACE.timer) RACE.timer = setTimeout(doWrite, 1500 - since);
}
function progressOf(r) { return r.finishedAt ? 3 : clamp((r.level || 0) + (r.total ? (r.done || 0) / r.total : 0), 0, 2.98); }
function rankList() {
  const all = { ...RACE.racers }, key = RACE.myId || 'me', mine = myRecord();
  if (mine) all[key] = mine; else delete all[key];
  return Object.entries(all).map(([id, r]) => ({ id, ...r, p: progressOf(r), isMe: id === key }))
    .sort((a, b) => (a.finishedAt && b.finishedAt) ? a.finishedAt - b.finishedAt : (b.p - a.p) || ((a.startedAt || 0) - (b.startedAt || 0)));
}
const ordinal = n => n + 'º';
function renderRace() {
  const list = rankList();
  raceNote.textContent = (RACE.db || RACE.mq) ? (list.length > 1 ? `${list.length} jugando` : 'esperando rivales') : 'tú solo';
  const groups = {};
  racersEl.innerHTML = list.map((r, i) => {
    const ch = CH[r.char] || CH.jorge, pct = r.p / 3 * 100;
    const slot = Math.round(pct / 5); groups[slot] = (groups[slot] || 0) + 1;
    const lift = (groups[slot] - 1) * 8;
    const nm = RACE.names[r.id] ? ` (${RACE.names[r.id]})` : '';
    return `<div class="racer${r.isMe ? ' me' : ''}${r.finishedAt ? ' done' : ''}" style="left:${pct.toFixed(1)}%;margin-top:${-17 - lift}px;z-index:${100 - i}" title="${esc(ch.name + nm)}">
      <img class="px" src="${ch.portrait}" alt="${esc(ch.short)}"><span class="pos">${ordinal(i + 1)}</span></div>`;
  }).join('');
}
async function resetRace() {
  if (RACE.mq) {
    for (const id of Object.keys(RACE.racers).concat(RACE.myId)) RACE.mq.publish(MQTT_ROOM + '/' + id, '', { retain: true, qos: 1 });
    RACE.racers = {}; RACE.startedAt = 0; renderRace(); return;
  }
  if (!RACE.db || !RACE.owner) return;
  try { const snap = await RACE.db.collection('racers').get(); for (const d of snap.docs) await RACE.db.doc('racers/' + d.id).delete(); } catch (_) {}
}

// ---------- Confetti ----------
let conf = [];
function confetti(n) {
  const cols = ['#f5c938', '#ea4f8b', '#7fd8ff', '#b04a2f', '#f6eedb', '#57a94c'];
  for (let i = 0; i < n; i++) conf.push({ x: Math.random() * fx.width, y: -Math.random() * fx.height * 0.6, vx: rand(-30, 30) * dpr, vy: rand(60, 160) * dpr, s: rand(4, 8) * dpr, r: Math.random() * 6, vr: rand(-6, 6), col: pick(cols) });
}
function updateConfetti(dt) {
  fctx.clearRect(0, 0, fx.width, fx.height);
  if (!conf.length) return;
  for (const p of conf) {
    p.x += (p.vx + Math.sin(p.y / 40) * 20 * dpr) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.col; fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore();
  }
  conf = conf.filter(p => p.y < fx.height + 20);
}

// ---------- Cake ----------
let cakeBlown = false, cakeT = 0, smoke = [];
function drawCake(dt) {
  const cv = $('cake'); if (!cv) return;
  const g = cv.getContext('2d'); cakeT += dt;
  g.clearRect(0, 0, 72, 60);
  rect(g, '#d9d4cc', 6, 54, 60, 3); rect(g, '#b9b2a4', 10, 57, 52, 1);
  rect(g, '#e9b872', 12, 36, 48, 18); rect(g, '#d29a52', 12, 50, 48, 4); rect(g, '#fbf3e4', 12, 43, 48, 3);
  rect(g, '#6b3b1f', 10, 30, 52, 7);
  for (let i = 0; i < 9; i++) rect(g, '#6b3b1f', 12 + i * 6, 37, 3, 2 + (i % 3));
  for (let i = 0; i < 5; i++) { rect(g, '#9b6534', 15 + i * 10, 31, 3, 2); rect(g, '#6e4320', 16 + i * 10, 31, 1, 2); }
  const cols = ['#ea4f8b', '#7fd8ff', '#f5c938', '#57a94c', '#f6eedb'];
  for (let i = 0; i < 5; i++) {
    const x = 18 + i * 9;
    rect(g, cols[i], x, 20, 3, 10); rect(g, '#ffffff', x, 22, 3, 1); rect(g, '#ffffff', x, 26, 3, 1); rect(g, '#2a2233', x + 1, 18, 1, 2);
    if (!cakeBlown) { const fl = Math.floor(cakeT * 10 + i) % 2; rect(g, '#f08a24', x, 13 + fl, 3, 5 - fl); rect(g, '#f5c938', x + 1, 12 + fl, 1, 5 - fl); }
  }
  for (const s of smoke) { s.y -= 10 * dt; s.x += Math.sin(s.y) * 0.2; s.life -= dt; g.fillStyle = `rgba(200,200,210,${Math.max(0, s.life)})`; g.fillRect(Math.round(s.x), Math.round(s.y), 2, 2); }
  smoke = smoke.filter(s => s.life > 0);
}

// ---------- Screens ----------
function showScreen(html, playing = false) {
  screenEl.innerHTML = html;
  screenEl.hidden = playing;
  touchEl.hidden = !(playing && isTouch);
  topBtns.hidden = !playing;
  if (!playing) { input.fire = false; input.mouseDown = false; input.jx = input.jy = 0; input.stickId = null; stick.hidden = true; fireBtn.classList.remove('on'); for (const k in keys) keys[k] = false; }
  const btn = screenEl.querySelector('.btn'); if (btn && !playing) setTimeout(() => { try { btn.focus({ preventScroll: true }); } catch (_) {} }, 50);
}
const controlsHTML = isTouch
  ? '<p class="controls"><b>Mover:</b> arrastra en la mitad izquierda · <b>Atacar:</b> mantén ATACA (apunta solo) · <b>Superpoder:</b> SÚPER cuando la barra esté llena</p>'
  : '<p class="controls"><b>Mover:</b> WASD o flechas · <b>Atacar:</b> clic para apuntar, o Espacio para apuntar solo · <b>Superpoder:</b> E cuando la barra esté llena · <b>Pausa:</b> P</p>';

function showTitle() {
  state = 'title';
  raceEl.hidden = false;
  showScreen(`
    <div class="title">
      <h1 class="logo"><span class="a">SUPERNOVA</span><span class="b">PATO</span></h1>
      <p class="byline">El Prof. Jorge Noval Pato y sus amigos contra la Generación Z</p>
      <canvas class="hero" id="hero" width="84" height="20"></canvas>
      <p class="story">Una plaga ha convertido a la Generación Z en patos. Elige a tu héroe y corre contra tus amigos: gana quien madure a todos los patos y llegue antes al final, en Burgos. La barra de abajo enseña quién va primero.</p>
      <div class="row">
        <button class="btn" id="startBtn" type="button">Empezar la historia</button>
        <button class="btn ghost" id="quickBtn" type="button">Saltar a elegir héroe</button>
      </div>
      ${RACE.owner ? '<div class="row"><button class="btn ghost small" id="resetBtn" type="button">Reiniciar la carrera para todos</button><span class="note" id="resetNote"></span></div>' : ''}
    </div>`);
  const h = $('hero').getContext('2d');
  h.imageSmoothingEnabled = false;
  h.drawImage(CH.jorge.spr.right, 2, 2);
  h.drawImage(SPR.nut, 22, 9); h.drawImage(SPR.nut, 30, 7);
  h.drawImage(SPR.duckDL, 42, 2); h.drawImage(SPR.grown, 54, 3); h.drawImage(SPR.duckFL, 66, 2);
  $('startBtn').onclick = () => { initAudio(); startStory(); };
  $('quickBtn').onclick = () => { initAudio(); showSelect(); };
  const rb = $('resetBtn');
  if (rb) rb.onclick = async () => {
    if (rb.dataset.armed !== '1') { rb.dataset.armed = '1'; rb.textContent = 'Sí, borrar la carrera'; $('resetNote').textContent = 'Borra el progreso de todos.'; return; }
    rb.disabled = true; await resetRace(); $('resetNote').textContent = 'Carrera reiniciada.'; rb.remove();
  };
}

function showSelect() {
  state = 'select';
  raceEl.hidden = false;
  showScreen(`
    <div class="select">
      <p class="eyebrow" style="color:var(--duck)">¿Quién eres tú?</p>
      <h2>Elige a tu héroe</h2>
      <div class="picks" id="picks">
        ${CHARS.map(ch => `<button class="pick" type="button" id="pick-${ch.id}" data-id="${ch.id}" aria-pressed="${ch.id === me.id}">
          <img class="px" src="${ch.portrait}" alt=""><span class="nm">${esc(ch.name)}</span><span class="rl">${esc(ch.role)}</span></button>`).join('')}
      </div>
      <div class="detail" id="detail"></div>
      ${controlsHTML}
      <div class="row"><button class="btn" id="goSel" type="button"></button></div>
    </div>`);
  const renderDetail = () => {
    $('detail').innerHTML = `<h3>${esc(me.name)}</h3>
      <p><b>Ataque:</b> ${esc(WEAPONS[me.weapon].label)}</p>
      <p><b>Superpoder · ${esc(me.sup.name)}:</b> ${esc(me.sup.desc)} Se carga madurando patos.</p>`;
    $('goSel').textContent = `Jugar con ${me.short}`;
  };
  $('picks').addEventListener('click', e => {
    const b = e.target.closest('.pick'); if (!b) return;
    me = CH[b.dataset.id]; store('snp-char', me.id);
    for (const p of $('picks').querySelectorAll('.pick')) p.setAttribute('aria-pressed', String(p.dataset.id === me.id));
    renderDetail();
  });
  renderDetail(); markLive();
  $('goSel').onclick = () => {
    initAudio(); startMusic();
    G.converted = 0; G.nuts = 0; G.damage = 0; G.time = 0;
    player = null; loadLevel(0);
    RACE.startedAt = Date.now(); RACE.finishedAt = null;
    raceSync(true);
    showIntro();
  };
}
function markLive() {
  const picks = $('picks'); if (!picks) return;
  const live = new Set(Object.entries(RACE.racers).filter(([id, r]) => id !== RACE.myId && !r.finishedAt).map(([, r]) => r.char));
  for (const b of picks.querySelectorAll('.pick')) {
    const old = b.querySelector('.live'); if (old) old.remove();
    if (live.has(b.dataset.id)) { const s = document.createElement('span'); s.className = 'live'; s.textContent = 'jugando'; b.appendChild(s); }
  }
}

function showIntro() {
  state = 'intro';
  const L = LEVELS[levelIdx];
  showScreen(`
    <div class="card">
      <p class="eyebrow">Nivel ${levelIdx + 1} de ${LEVELS.length} · ${L.subject}</p>
      <h2>${L.name}</h2>
      <p>${L.intro}</p>
      <p class="goal">Objetivo: madurar ${lv.total} pato${lv.total === 1 ? '' : 's'}${levelIdx === 2 ? ' y al Influencer' : ''}</p>
      <button class="btn" id="goBtn" type="button">A clase</button>
    </div>`);
  $('goBtn').onclick = () => { initAudio(); startMusic(); state = 'play'; showScreen('', true); raceSync(); };
}

function gradeFor(dmg) {
  if (dmg === 0) return ['10', 'Matrícula de Honor'];
  if (dmg === 1) return ['9', 'Sobresaliente'];
  if (dmg <= 2) return ['7,5', 'Notable'];
  if (dmg <= 3) return ['6', 'Aprobado'];
  return ['5', 'Aprobado raspado'];
}
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function showClear() {
  state = 'clear';
  const L = LEVELS[levelIdx], [num, word] = gradeFor(lv.damage);
  const list = rankList(), rank = list.findIndex(r => r.isMe) + 1;
  showScreen(`
    <div class="card">
      <span class="stamp">Aprobado</span>
      <p class="eyebrow">Acta de calificaciones · Convocatoria ordinaria</p>
      <h2>${L.name}</h2>
      <dl class="acta">
        <dt>Alumno</dt><dd>${esc(me.name)}</dd>
        <dt>Asignatura</dt><dd>${L.subject}</dd>
        <dt>Patos madurados</dt><dd>${lv.converted}</dd>
        <dt>Ataques</dt><dd>${lv.nuts}</dd>
        <dt>Tiempo</dt><dd>${fmtTime(lv.time)}</dd>
        ${list.length > 1 ? `<dt>Carrera</dt><dd>vas ${ordinal(rank)} de ${list.length}</dd>` : ''}
      </dl>
      <div class="grade"><span class="num">${num}</span><span class="word">${word}</span></div>
      <p class="sign">Firmado: Prof. J. Noval Pato</p>
      <button class="btn" id="nextBtn" type="button">Siguiente nivel</button>
    </div>`);
  $('nextBtn').onclick = () => { loadLevel(levelIdx + 1); raceSync(true); showIntro(); };
}

function showGameOver() {
  state = 'over';
  const L = LEVELS[levelIdx];
  showScreen(`
    <div class="card">
      <span class="stamp">Suspenso</span>
      <p class="eyebrow">Acta de calificaciones · ${L.subject}</p>
      <h2>Te han ganado los patos</h2>
      <p>Te has quedado sin corazones en ${L.name}. Has madurado ${lv.converted} de ${lv.total} patos. Hay convocatoria extraordinaria: repites el nivel con el corazón entero, pero tus rivales siguen corriendo.</p>
      <div class="grade"><span class="num">3,2</span><span class="word">Suspenso</span></div>
      <button class="btn" id="retryBtn" type="button">Ir a la extraordinaria</button>
    </div>`);
  $('retryBtn').onclick = () => {
    initAudio(); G.converted -= lv.converted;
    const ch = player.charge; player = null; loadLevel(levelIdx); player.hp = 5; player.charge = ch;
    raceSync(true); showIntro();
  };
}

function pause() {
  state = 'paused';
  showScreen(`
    <div class="card">
      <p class="eyebrow">Recreo</p>
      <h2>Pausa</h2>
      <p>Los patos esperan. Tus rivales, no.</p>
      <button class="btn" id="resumeBtn" type="button">Seguir con la clase</button>
    </div>`);
  $('resumeBtn').onclick = () => { initAudio(); state = 'play'; showScreen('', true); };
}

function showFinal() {
  state = 'final';
  stopMusic();
  RACE.finishedAt = Date.now(); raceSync(true);
  cakeBlown = false; cakeT = 0; smoke = [];
  const list = rankList(), pos = list.findIndex(r => r.isMe) + 1;
  const podium = list.length > 1 ? `<ol class="podium">${list.slice(0, 9).map((r, i) => {
    const ch = CH[r.char] || CH.jorge, nm = RACE.names[r.id] ? ` · ${esc(RACE.names[r.id])}` : '';
    return `<li class="${r.isMe ? 'me' : ''}"><span class="p">${ordinal(i + 1)}</span><img class="px" src="${ch.portrait}" alt=""><span>${esc(ch.short)}${nm}</span><span>${r.finishedAt ? 'meta' : 'nivel ' + (Math.min(2, r.level || 0) + 1)}</span></li>`;
  }).join('')}</ol>` : '';
  showScreen(`
    <div class="final">
      <canvas id="cake" width="72" height="60"></canvas>
      <h2>¡Feliz cumpleaños, Jorge!</h2>
      ${list.length > 1 ? `<p class="from">${esc(me.short)} ha llegado ${ordinal(pos)} a Burgos</p>` : ''}
      ${podium}
      <p>Entre todos habéis convertido a la Generación Z en adultos hechos y derechos, y el Pato Influencer ya está preparando oposiciones. Hoy el que cumple años eres tú: que vengan muchas nueces, muchas escapadas a Burgos, muchas victorias del Sporting en El Molinón, música de los 80 a todo volumen y alumnos que lean el BOE sin que se lo pidas. ¡Puxa Sporting!</p>
      <p class="from">De parte de Paolo y de todos tus amigos de Lantegui</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="blowBtn" type="button">Soplar las velas</button>
        <button class="btn ghost" id="againBtn" type="button">Jugar otra vez</button>
      </div>
    </div>`);
  confetti(160);
  $('blowBtn').onclick = () => {
    initAudio();
    if (!cakeBlown) {
      cakeBlown = true;
      for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) smoke.push({ x: 19 + i * 9, y: 14 - j * 2, life: 1 + j * 0.3 });
      confetti(260); playBirthday();
      $('blowBtn').textContent = 'Otra vez la canción';
    } else { confetti(120); playBirthday(); }
  };
  $('againBtn').onclick = () => { conf = []; showTitle(); };
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play' || state === 'dying') update(dt);
  else if (state === 'story') updateStory(dt);
  else if (bg) { T += dt; for (const e of enemies) e.t += dt; }
  if (state === 'final') drawCake(dt);
  render();
  updateConfetti(dt);
  requestAnimationFrame(frame);
}

loadLevel(0);
showTitle();
renderRace();
initRace();
requestAnimationFrame(frame);
})();
</script>
